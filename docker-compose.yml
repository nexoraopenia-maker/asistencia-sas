name: scire360-chronos

services:
  postgres:
    image: postgres:16-alpine
    container_name: scire360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scire_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scire360}
      # Colacion determinista para ordenamientos consistentes entre entornos
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scire} -d ${POSTGRES_DB:-scire360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: scire360-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consola web opcional para inspeccionar la base en desarrollo.
  # Levantala con: docker compose --profile tools up -d
  adminer:
    image: adminer:latest
    container_name: scire360-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Almacenamiento S3-compatible local para probar el flujo de selfies
  # sin depender de AWS S3 / Cloudflare R2.
  # Levantalo con: docker compose --profile tools up -d
  minio:
    image: minio/minio:latest
    container_name: scire360-minio
    restart: unless-stopped
    profiles: ["tools"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-scireminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-scireminio_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
